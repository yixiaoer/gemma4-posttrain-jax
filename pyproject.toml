[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "gemma4-posttrain-jax"
version = "0.0.1"
description = "Functional JAX SFT and reinforcement learning for Gemma 4 on a single-host TPU v4-8."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "yixiaoer" }]
dependencies = [
    "jax>=0.11.0",
    "numpy>=2.3.5",
    "einops>=0.8",
    "optax>=0.2.8",
    "safetensors>=0.8.0",
]

[project.optional-dependencies]
tpu = ["jax[tpu]>=0.11.0"]
hf = [
    "torch>=2.14.0",
    "transformers>=5.16.1",
    "huggingface-hub>=1.29",
    "datasets>=5.0",
    "math-verify>=0.9",
]
tracking = ["wandb>=0.22"]
dev = [
    "pytest>=9.1",
    "pytest-cov>=7.1",
    "ruff>=0.16",
    "mypy>=2.3",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["gemma4_posttrain_jax*"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]
markers = [
    "tpu: requires the real TPU v4-8 and the TPU-enabled JAX environment",
    "full_model: loads a real Gemma 4 checkpoint (multi-GB)",
]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
